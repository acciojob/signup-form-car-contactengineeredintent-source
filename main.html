<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form action="/submit" method="POST">
	<!-- the entire body must be written by student -->
	<label for="name">Name</label>
	<input type="text" id="name" placeholder="Name">
	<br>
	<input type="email" id="email" placeholder="Email">
	<br>
	<input type="radio" id="gender_m" name="gender">
	<label for="gender_m">Male</label>
	<br>
	<input type="radio" id="gender_f" name="gender">
	<label for="gender_f">Female</label>
	<br>
	<label for="cars">Please choose an option</label>
	<select id="cars">
		<option value="maserati">Maserati</option>
		<option value="bmw">BMW</option>
		<option value="mercedes">Mercedes</option>
	</select>
	<br>
	<input type="number" id="age" placeholder="Age">
	<br>
	<input type="date" id="dob">
	<br>
	<input type="tel" id="tel" placeholder="xxx-xxx-xxxx">
	<br>
	<input type="password" id="password" placeholder="Password">
	<br>
	<label for="tos">I agree to the TOS</label>
	<input type="checkbox" id="tos">
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
