<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form action="/submit" method="POST">
	<!-- the entire body must be written by student -->
		<label for="name">Name</label>
		<input type="text" id="name" placeholder="Name">
		<br>
		<label for="email">Email</label>
		<input type="email" id="email" placeholder="Email">
		<br>
		<label for="radio">Gender</label>
		<input type="radio" id="gender_m" name="gender">
		<label for="gender_m">Male</label>
		<input type="radio" id="gender_f" name="gender">
		<label for="gender_f">Female</label>
		<br>
		<label for="cars">Car Brands</label>
		<select placeholder="--Please choose an option--" id="cars" required>
			<option value="maserati">Maserati</option>
			<option value="bmw">BMW</option>
			<option value="mercedes">Mercedes</option>
		</select>
		<br>
		<label for="age">Age</label>
		<input type="number" id="age" placeholder="Age">
		<br>
		<label for="dob">DOB</label>
		<input type="date" id="dob">
		<br>
		<label for="tel">Phone Number</label>
		<input type="tel" id="tel" placeholder="xxx-xxx-xxxx">
		<br>
		<label for="password">Password</label>
		<input type="password" id="password" placeholder="Password">
		<br>
		<label for="tos">I agree to the TOS</label>
		<input type="checkbox" id="tos">
		<br>
		<button>submit</button>
	</form>
    <script type="text/javascript" src="./script.js"></script>
</body>

</html>
